name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish a GitHub Release

jobs:
  macos:
    name: macOS universal (VST3 + AU)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Run tests
        run: |
          set +e
          ./build/TwistedBreaksTests_artefacts/Release/TwistedBreaksTests > tests.log 2>&1
          code=$?
          cat tests.log
          grep -F "[FAIL]" tests.log | while IFS= read -r line; do echo "::error title=Unit test::$line"; done
          tail -1 tests.log | sed 's/^/::notice title=Unit tests::/'
          exit $code

      - name: Render UI snapshot
        run: ./build/TwistedBreaksTests_artefacts/Release/TwistedBreaksTests --snapshot ui-snapshot.png

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - build/TwistedBreaks_artefacts/Release/VST3/TwistedBreaks.vst3
          codesign --force --deep --sign - build/TwistedBreaks_artefacts/Release/AU/TwistedBreaks.component

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/TwistedBreaks_artefacts/Release/AU/TwistedBreaks.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i twisted || true
          auval -strict -v aumu Twbk Twgn

      - name: Host round trip (AU + VST3, as Ableton does it)
        run: |
          set +e
          for target in "build/TwistedBreaks_artefacts/Release/VST3/TwistedBreaks.vst3" "TwistedBreaks.component"; do
            ./build/TwistedBreaksHostTest_artefacts/Release/TwistedBreaksHostTest "$target" > host.log 2>&1
            code=$?
            cat host.log
            # Surface every line as an annotation so results are readable via the API.
            while IFS= read -r line; do
              case "$line" in
                *"[FAIL]"*) echo "::error title=HostTest $target::$line" ;;
                *) [ -n "$line" ] && echo "::notice title=HostTest $target::$line" ;;
              esac
            done < host.log
            [ $code -ne 0 ] && failed=1
          done
          exit ${failed:-0}

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --validate-in-process \
            --validate build/TwistedBreaks_artefacts/Release/VST3/TwistedBreaks.vst3

      - name: Package
        run: |
          mkdir -p dist
          ditto build/TwistedBreaks_artefacts/Release/VST3/TwistedBreaks.vst3 dist/TwistedBreaks.vst3
          ditto build/TwistedBreaks_artefacts/Release/AU/TwistedBreaks.component dist/TwistedBreaks.component
          cp ui-snapshot.png dist/
          cat > dist/INSTALL.txt <<'EOF'
          Copy TwistedBreaks.vst3      -> ~/Library/Audio/Plug-Ins/VST3/
          Copy TwistedBreaks.component -> ~/Library/Audio/Plug-Ins/Components/
          Then in Terminal (downloaded files are quarantined by macOS):
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/TwistedBreaks.vst3
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/TwistedBreaks.component
            killall -9 AudioComponentRegistrar
          Ableton: Settings > Plug-Ins > Rescan.
          EOF
          cd dist && ditto -c -k --keepParent . ../TwistedBreaks-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TwistedBreaks-macOS
          path: TwistedBreaks-macOS.zip


  linux-tests:
    name: Linux (VST3 build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev xvfb
      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests
        run: xvfb-run -a ./build/TwistedBreaksTests_artefacts/Release/TwistedBreaksTests

  windows:
    name: Windows x64 (VST3)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        run: |
          set +e
          ./build/TwistedBreaksTests_artefacts/Release/TwistedBreaksTests.exe > tests.log 2>&1
          code=$?
          cat tests.log
          grep -F "[FAIL]" tests.log | while IFS= read -r line; do echo "::error title=Unit test (Windows)::$line"; done
          tail -1 tests.log | sed 's/^/::notice title=Unit tests (Windows)::/'
          if [ $code -ne 0 ]; then
            echo "::error title=Unit tests (Windows)::exit code $code"
            tail -12 tests.log | while IFS= read -r line; do echo "::notice title=Last test lines::$line"; done
          fi
          exit $code

      - name: Crash stack (if the tests crashed)
        if: failure()
        run: |
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          [ -x "$CDB" ] || { echo "::warning title=cdb::not found"; exit 0; }
          "$CDB" -G -lines -y "build/TwistedBreaksTests_artefacts/Release" \
            -c "sxd av; sxe -c \".ecxr;kp 25;q\" av; sxe -c \".ecxr;kp 25;q\" c0000409; sxe -c \".ecxr;kp 25;q\" c0000374; g; kp 25; q" \
            ./build/TwistedBreaksTests_artefacts/Release/TwistedBreaksTests.exe > cdb.log 2>&1 || true
          grep -E "^[0-9a-f]{2} |ExceptionCode|Access violation|FAILURE_BUCKET|^\(.*\):" cdb.log | head -40 | while IFS= read -r line; do echo "::notice title=Crash stack::$line"; done
          tail -25 cdb.log | while IFS= read -r line; do echo "::notice title=cdb tail::$line"; done

      - name: Render UI snapshot
        run: ./build/TwistedBreaksTests_artefacts/Release/TwistedBreaksTests.exe --snapshot ui-snapshot-windows.png

      - name: Host round trip (VST3, as Ableton does it)
        run: |
          set +e
          ./build/TwistedBreaksHostTest_artefacts/Release/TwistedBreaksHostTest.exe "build/TwistedBreaks_artefacts/Release/VST3/TwistedBreaks.vst3" > host.log 2>&1
          code=$?
          cat host.log
          while IFS= read -r line; do
            case "$line" in
              *"[FAIL]"*) echo "::error title=HostTest (Windows)::$line" ;;
              *) [ -n "$line" ] && echo "::notice title=HostTest (Windows)::$line" ;;
            esac
          done < host.log
          exit $code

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 7 --validate-in-process \
            --validate build/TwistedBreaks_artefacts/Release/VST3/TwistedBreaks.vst3

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/TwistedBreaks_artefacts/Release/VST3/TwistedBreaks.vst3 dist/
          cp ui-snapshot-windows.png dist/
          cat > dist/INSTALL.txt <<'EOF'
          Twisted Breaks for Windows (64-bit VST3)

          1. Copy the whole TwistedBreaks.vst3 folder to
               C:\Program Files\Common Files\VST3\
          2. Ableton Live: Options > Preferences > Plug-Ins, turn on
             "Use VST3 Plug-in System Folders", then Rescan.
          3. Twisted Breaks appears under Plug-Ins > Twisted Genetics.

          If Windows says the files are blocked: right-click the zip > Properties >
          Unblock, before unzipping.
          EOF
          sed -i 's/^          //' dist/INSTALL.txt
          cd dist && 7z a -tzip ../TwistedBreaks-Windows.zip . > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: TwistedBreaks-Windows
          path: TwistedBreaks-Windows.zip

  # Every green build of main becomes a downloadable Release
  # (repo front page -> Releases), so there's no digging in Actions.
  release:
    name: Publish release
    needs: [macos, windows, linux-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^project(TwistedBreaks VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" dist/TwistedBreaks-macOS.zip dist/TwistedBreaks-Windows.zip \
            --target "${{ github.sha }}" \
            --title "Twisted Breaks ${VERSION} (build ${{ github.run_number }})" \
            --latest \
            --notes "$(git log -1 --pretty=%B)

          Mac: TwistedBreaks-macOS.zip - unzip, then follow INSTALL.txt (copy the .vst3 and .component into your plug-in folders, clear quarantine, rescan in Ableton).
          Windows: TwistedBreaks-Windows.zip - unzip, copy TwistedBreaks.vst3 into C:\Program Files\Common Files\VST3, rescan in Ableton."
